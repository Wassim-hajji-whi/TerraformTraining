<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click the Box</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #gameArea {
      position: relative;
      width: 400px;
      height: 400px;
      border: 2px solid #fff;
      margin-top: 15px;
      overflow: hidden;
    }

    #box {
      position: absolute;
      width: 50px;
      height: 50px;
      background: #4caf50;
      cursor: pointer;
    }

    #score {
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

<h1>🎮 Click the Box</h1>
<div id="score">Score: 0</div>

<div id="gameArea">
  <div id="box"></div>
</div>

<script>
  const box = document.getElementById("box");
  const gameArea = document.getElementById("gameArea");
  const scoreEl = document.getElementById("score");

  let score = 0;

  function moveBox() {
    const maxX = gameArea.clientWidth - box.clientWidth;
    const maxY = gameArea.clientHeight - box.clientHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    box.style.left = x + "px";
    box.style.top = y + "px";
  }

  box.addEventListener("click", () => {
    score++;
    scoreEl.textContent = "Score: " + score;
    moveBox();
  });

  moveBox();
</script>

</body>
</html>
