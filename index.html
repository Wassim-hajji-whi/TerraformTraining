<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Enhanced Tic-Tac-Toe</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    background: #f0f0f0;
  }

  h1 {
    margin-bottom: 10px;
  }

  #game {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 5px;
  }

  .cell {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2.5rem;
    background: #fff;
    border: 2px solid #333;
    cursor: pointer;
    transition: transform 0.2s, background 0.3s;
  }

  .cell:hover {
    background: #e0e0e0;
  }

  .cell.x {
    color: #d32f2f;
    transform: scale(1.1);
  }

  .cell.o {
    color: #1976d2;
    transform: scale(1.1);
  }

  .win {
    background: #ffeb3b !important;
  }

  #info {
    margin-top: 15px;
    text-align: center;
  }

  #info div {
    margin: 5px 0;
  }

  button {
    margin-top: 10px;
    padding: 8px 16px;
    font-size: 1rem;
    cursor: pointer;
  }

  #mode {
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<h1>Enhanced Tic-Tac-Toe</h1>

<div id="mode">
  <label>
    <input type="radio" name="mode" value="pvp" checked> Player vs Player
  </label>
  <label>
    <input type="radio" name="mode" value="cpu"> Player vs CPU
  </label>
</div>

<div id="game"></div>

<div id="info">
  <div id="message">Player X's Turn</div>
  <div>Score: X - <span id="scoreX">0</span> | O - <span id="scoreO">0</span></div>
</div>

<button onclick="resetGame()">Restart Game</button>

<script>
  const game = document.getElementById("game");
  const message = document.getElementById("message");
  const scoreXEl = document.getElementById("scoreX");
  const scoreOEl = document.getElementById("scoreO");
  const modeInputs = document.getElementsByName("mode");

  let board = ["", "", "", "", "", "", "", "", ""];
  let currentPlayer = "X";
  let gameOver = false;
  let score = { X: 0, O: 0 };
  let mode = "pvp";

  const winCombos = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  function createBoard() {
    game.innerHTML = "";
    board.forEach((cell, index) => {
      const div = document.createElement("div");
      div.classList.add("cell");
      div.dataset.index = index;
      div.addEventListener("click", handleMove);
      div.textContent = cell;
      if(cell) div.classList.add(cell.toLowerCase());
      game.appendChild(div);
    });
  }

  function handleMove(e) {
    const index = e.target.dataset.index;
    if (board[index] === "" && !gameOver) {
      makeMove(index, currentPlayer);
      if(mode === "cpu" && !gameOver && currentPlayer === "O") {
        setTimeout(cpuMove, 400);
      }
    }
  }

  function makeMove(index, player) {
    board[index] = player;
    updateCell(index, player);
    if (checkWin(player)) {
      message.textContent = `Player ${player} Wins!`;
      highlightWin(player);
      score[player]++;
      updateScore();
      gameOver = true;
    } else if (board.every(cell => cell !== "")) {
      message.textContent = "It's a Draw!";
      gameOver = true;
    } else {
      currentPlayer = player === "X" ? "O" : "X";
      message.textContent = `Player ${currentPlayer}'s Turn`;
    }
  }

  function updateCell(index, player) {
    const cell = game.querySelector(`.cell[data-index='${index}']`);
    cell.textContent = player;
    cell.classList.add(player.toLowerCase());
  }

  function checkWin(player) {
    return winCombos.some(combo => combo.every(i => board[i] === player));
  }

  function highlightWin(player) {
    winCombos.forEach(combo => {
      if(combo.every(i => board[i] === player)) {
        combo.forEach(i => {
          game.querySelector(`.cell[data-index='${i}']`).classList.add("win");
        });
      }
    });
  }

  function updateScore() {
    scoreXEl.textContent = score.X;
    scoreOEl.textContent = score.O;
  }

  function resetGame() {
    board = ["", "", "", "", "", "", "", "", ""];
    currentPlayer = "X";
    gameOver = false;
    message.textContent = `Player ${currentPlayer}'s Turn`;
    createBoard();
  }

  function cpuMove() {
    const emptyIndexes = board.map((val,i)=>val===""?i:null).filter(v=>v!==null);
    if(emptyIndexes.length===0) return;
    const randomIndex = emptyIndexes[Math.floor(Math.random()*emptyIndexes.length)];
    makeMove(randomIndex, "O");
  }

  // Listen for mode changes
  modeInputs.forEach(input => {
    input.addEventListener("change", () => {
      mode = document.querySelector('input[name="mode"]:checked').value;
      resetGame();
    });
  });

  // Initialize
  createBoard();
</script>

</body>
</html>
