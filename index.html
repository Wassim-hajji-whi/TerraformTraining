<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dino Game Enhanced</title>
<style>
  body {
    margin: 0;
    font-family: monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f7f7f7;
    transition: background 0.5s;
  }

  #game {
    position: relative;
    width: 600px;
    height: 200px;
    border: 2px solid #333;
    overflow: hidden;
    background: #fff;
  }

  #dino {
    position: absolute;
    bottom: 0;
    left: 50px;
    width: 40px;
    height: 40px;
    background: url('https://i.imgur.com/OZ0K0Yb.png') no-repeat center/contain;
  }

  .cactus {
    position: absolute;
    bottom: 0;
    width: 20px;
    background: url('https://i.imgur.com/MBcOclQ.png') no-repeat center/contain;
  }

  #score {
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 14px;
  }

  .jump {
    animation: jump 0.45s linear;
  }

  @keyframes jump {
    0% { bottom: 0; }
    50% { bottom: 90px; }
    100% { bottom: 0; }
  }
</style>
</head>
<body>

<div id="game">
  <div id="dino"></div>
  <div id="score">Score: 0</div>
</div>

<audio id="jumpSound" src="https://freesound.org/data/previews/331/331912_3248244-lq.mp3"></audio>
<audio id="gameOverSound" src="https://freesound.org/data/previews/331/331912_3248244-lq.mp3"></audio>

<script>
  const game = document.getElementById("game");
  const dino = document.getElementById("dino");
  const scoreEl = document.getElementById("score");
  const jumpSound = document.getElementById("jumpSound");
  const gameOverSound = document.getElementById("gameOverSound");

  let score = 0;
  let speed = 5;
  let gameOver = false;
  let obstacles = [];

  // Create multiple obstacles
  function createObstacle() {
    const cactus = document.createElement("div");
    cactus.classList.add("cactus");
    cactus.style.height = Math.random() > 0.5 ? "50px" : "30px";
    cactus.style.right = "-20px";
    game.appendChild(cactus);
    obstacles.push(cactus);
  }

  setInterval(() => {
    if (!gameOver) createObstacle();
  }, 2000);

  function jump() {
    if (!dino.classList.contains("jump")) {
      dino.classList.add("jump");
      jumpSound.play();
      setTimeout(() => dino.classList.remove("jump"), 450);
    }
  }

  document.addEventListener("keydown", e => { if(e.code==="Space") jump(); });
  document.addEventListener("click", jump);
  document.addEventListener("touchstart", jump);

  // Day/Night mode
  setInterval(() => {
    document.body.style.background = (score % 20 < 10) ? "#f7f7f7" : "#222";
  }, 500);

  function gameLoop() {
    if (gameOver) return;

    obstacles.forEach((cactus, index) => {
      let right = parseFloat(cactus.style.right);
      right += speed;
      cactus.style.right = right + "px";

      const cactusLeft = game.clientWidth - right - parseInt(cactus.style.width);
      const dinoBottom = parseInt(getComputedStyle(dino).bottom);

      if (
        cactusLeft < dino.offsetLeft + 40 &&
        cactusLeft + parseInt(cactus.style.width) > dino.offsetLeft &&
        dinoBottom < parseInt(cactus.style.height)
      ) {
        gameOver = true;
        gameOverSound.play();
        alert("Game Over! Score: " + score);
        location.reload();
      }

      if (cactusLeft < -20) {
        cactus.remove();
        obstacles.splice(index, 1);
        score++;
        scoreEl.textContent = "Score: " + score;
        if (score % 5 === 0) speed += 0.5;
      }
    });

    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>

</body>
</html>
