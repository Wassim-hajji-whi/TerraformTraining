<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hello Internet</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e1e2f, #3a3a6a);
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }
    .card {
      background: rgba(0, 0, 0, 0.35);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    h1 {
      margin-bottom: 10px;
      font-size: 2.2rem;
    }
    p {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Hello, World</h1>
    <p>This page exists.</p>
    <p>And now you know.</p>
  </div>
</body>
</html>
